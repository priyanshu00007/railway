version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: railbook_postgres
    environment:
      POSTGRES_USER: rail_admin
      POSTGRES_PASSWORD: rail_secret_pw
      POSTGRES_DB: railbook_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rail_admin -d railbook_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata: